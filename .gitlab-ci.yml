stages:
  - test
  - build
  - promote

default:
  interruptible: true

.promote:
  stage: promote
  image: alpine/git:2.45.2
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      if [ -z "${GITOPS_DEPLOY_TOKEN:-}" ]; then
        echo "GITOPS_DEPLOY_TOKEN is not set - see docs/gitops.md for how to create it." >&2
        exit 1
      fi
    - git clone --depth 1 "https://gitops-ci:${GITOPS_DEPLOY_TOKEN}@gitlab.com/acp-group3273029/alex-container-platform-gitops.git" gitops
    - |
      sed -i "s/^\([[:space:]]*newTag:[[:space:]]*\).*/\1${CI_COMMIT_SHA}/" \
        "gitops/kubernetes/overlays/development/${SERVICE_NAME}/kustomization.yaml"
    - cd gitops
    - git config user.email "ci@alex-container-platform"
    - git config user.name "GitLab CI"
    - |
      if git diff --quiet; then
        echo "Overlay already pinned to ${CI_COMMIT_SHA}, nothing to commit."
      else
        git commit -am "Deploy ${SERVICE_NAME} ${CI_COMMIT_SHA}

      Promoted by ${CI_PIPELINE_URL}
      Source commit: https://gitlab.com/acp-group3273029/alex-container-platform/-/commit/${CI_COMMIT_SHA}"
        git push origin main
      fi

fixture-service:test:
  stage: test
  image: node:20-alpine
  variables:
    SERVICE_DIRECTORY: services/fixture-service
  cache:
    key:
      files:
        - services/fixture-service/package.json
    paths:
      - services/fixture-service/.npm/
  before_script:
    - cd "$SERVICE_DIRECTORY"
    - npm install --cache .npm --prefer-offline
  script:
    - npm test

fixture-service:integration-test:
  stage: test
  image: node:20-alpine
  variables:
    SERVICE_DIRECTORY: services/fixture-service
    POSTGRES_DB: fixtures
    POSTGRES_USER: fixtures
    POSTGRES_PASSWORD: fixtures
    DATABASE_URL: postgresql://fixtures:fixtures@postgres:5432/fixtures
  services:
    - name: postgres:16-alpine
      alias: postgres
  cache:
    key:
      files:
        - services/fixture-service/package.json
    paths:
      - services/fixture-service/.npm/
  before_script:
    - cd "$SERVICE_DIRECTORY"
    - npm install --cache .npm --prefer-offline
  script:
    - npm run migrate
    - npm run test:integration

fixture-service:build:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_TAG: "$CI_REGISTRY_IMAGE/fixture-service:$CI_COMMIT_SHA"
  script:
    - docker build --tag "$IMAGE_TAG" services/fixture-service
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE_TAG"
        docker tag "$IMAGE_TAG" "$CI_REGISTRY_IMAGE/fixture-service:development"
        docker push "$CI_REGISTRY_IMAGE/fixture-service:development"
      fi
    - echo "FIXTURE_SERVICE_IMAGE=$IMAGE_TAG" > fixture-service-image.env
  artifacts:
    reports:
      dotenv: fixture-service-image.env
    name: "fixture-service-$CI_COMMIT_SHORT_SHA"
    paths:
      - fixture-service-image.env
    expire_in: 1 day

fixture-service:promote:
  extends: .promote
  needs:
    - job: fixture-service:build
      artifacts: true
  variables:
    SERVICE_NAME: fixture-service

