apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fixture-service
  namespace: match-data
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - fixture-service.local
      secretName: fixture-service-tls
  rules:
    - host: fixture-service.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fixture-service
                port:
                  number: 80
