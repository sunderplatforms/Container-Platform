apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fixture-service-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fixture-service-postgres
spec:
  selector:
    app.kubernetes.io/name: fixture-service-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-service-postgres
  labels:
    app.kubernetes.io/name: fixture-service-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fixture-service-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fixture-service-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: matchops
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fixture-service-database
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixture-service-database
                  key: password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fixture-service-postgres
