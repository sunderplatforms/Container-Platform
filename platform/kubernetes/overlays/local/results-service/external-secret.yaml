apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: results-service-database
  namespace: match-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: local-secret-store
  target:
    name: results-service-database
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: results-service-database
        property: url
    - secretKey: username
      remoteRef:
        key: results-service-database
        property: username
    - secretKey: password
      remoteRef:
        key: results-service-database
        property: password
