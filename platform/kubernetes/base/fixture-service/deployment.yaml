apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-service
  labels:
    app.kubernetes.io/name: fixture-service
    app.kubernetes.io/part-of: football-platform-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fixture-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fixture-service
    spec:
      serviceAccountName: fixture-service
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture-service
          image: fixture-service:0.1.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fixture-service-database
                  key: url
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
